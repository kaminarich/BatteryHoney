<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Battery Honey</title>
    <link rel="stylesheet" href="assets/index.css">
    <script defer src="assets/style.js"></script>
</head>
<body>
html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow-x: hidden;
}
<canvas id="matrixCanvas"></canvas>
    <div class="container">
        <h1>BATTERY HONEY</h1>

        <div class="log-section">
            <h2>Sebastian Reclaim LOG</h2>
            <div class="log-box" id="reclaim-log">Loading...</div>
        </div>

        <div class="log-section">
            <h2>Monitor LOG</h2>
            <div class="log-box" id="monitor-log">Loading...</div>
        </div>
    </div>
    <script>
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');

// Set canvas fullscreen
canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

// Character set
const letters = '01あいうえおカキクケコ123647959929872';
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array.from({ length: columns }).fill(1);

// Draw function
function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00ff00';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height || Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

// Run every 70ms
setInterval(drawMatrix, 70);

// Resize canvas on window change
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
